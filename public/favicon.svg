<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#2e7d32"/>
  <!-- cart basket (trapezoid) -->
  <path d="M22 34 H86 L78 62 H30 Z" fill="white"/>
  <!-- $ inside basket (green cutout) -->
  <text x="55" y="57" text-anchor="middle" font-size="26" font-weight="900"
        font-family="Arial Black, Arial, sans-serif" fill="#2e7d32">$</text>
  <!-- handle bar -->
  <line x1="6" y1="26" x2="34" y2="26" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- pole connecting handle to basket -->
  <line x1="22" y1="26" x2="22" y2="42" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- wheels -->
  <circle cx="36" cy="76" r="8" fill="white"/>
  <circle cx="72" cy="76" r="8" fill="white"/>
</svg>
