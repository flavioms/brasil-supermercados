name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint + Type check
        run: npm run lint

      - name: Verificar formatação
        run: npm run format:check

      - name: Testes unitários com cobertura
        run: npm run test:coverage

      - name: Upload cobertura
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
        if: always()

      - name: Instalar Chromium para Playwright
        run: npx playwright install chromium --with-deps

      - name: Testes E2E
        run: npm run test:e2e

      - name: Build estático de produção
        run: npm run build
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_PROJECT_ID }}

      - name: Upload artifact de build
        uses: actions/upload-artifact@v4
        with:
          name: static-out
          path: out/
          retention-days: 1

  deploy-preview:
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact de build
        uses: actions/download-artifact@v4
        with:
          name: static-out
          path: out/

      - name: Deploy preview para Cloudflare Pages
        run: npx wrangler@3 pages deploy out --project-name=supermercado-brasil --branch=${{ github.head_ref }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact de build
        uses: actions/download-artifact@v4
        with:
          name: static-out
          path: out/

      - name: Deploy produção para Cloudflare Pages
        run: npx wrangler@3 pages deploy out --project-name=supermercado-brasil --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
